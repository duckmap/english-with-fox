version: 2

release:
  disable: true 

before:
  hooks:
    - go mod tidy

builds:
  - id: english-with-fox
    main: . 
    binary: WordGame
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -H=windowsgui

archives:
  - id: default
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - assets/**/*
      - web/**/*
      - licenses/**/*
      - PLAY_WINDOWS.bat
      - RUN_SOURCE_WINDOWS.bat
      - START_SERVER.py
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'