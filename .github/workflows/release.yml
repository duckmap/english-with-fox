
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"

          go build -trimpath `
            -ldflags="-s -w -H=windowsgui" `
            -o build/english-with-fox-windows-amd64.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/english-with-fox-windows-amd64.exe

  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        run: |
          mkdir -p build
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o build/english-with-fox .

      - name: Prepare AppImage
        run: |
          mkdir -p dist
          cp preview.png packaging/english-with-fox.png

          cat > packaging/english-with-fox.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=English with Fox
          Comment=Угадай английское слово вместе с лисёнком
          Exec=english-with-fox
          Icon=english-with-fox
          Terminal=false
          Categories=Game;Education;
          EOF

      - name: Install linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable build/english-with-fox \
            --desktop-file packaging/english-with-fox.desktop \
            --icon-file packaging/english-with-fox.png \
            --output appimage

          mv ./*.AppImage dist/english-with-fox-linux-amd64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/english-with-fox-linux-amd64.AppImage

  publish:
    name: Publish Release
    needs:
      - windows
      - linux

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
