<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>Угадай слово — English with Fox</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff9e9;font-family:Arial,sans-serif;color:#1e2343}canvas{display:block;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:16px;padding:24px;background:#fff9e9;z-index:9}h1{font-size:clamp(26px,5vw,48px);margin:0}p{margin:0;line-height:1.5}#error{color:#99392f;max-width:640px}#launch{font:700 22px Arial;border:3px solid #1e2343;border-radius:20px;background:#64b8f3;color:#1e2343;padding:18px 40px;cursor:pointer;min-height:64px}#launch:focus-visible{outline:4px solid #236aa5;outline-offset:4px}.note{font-size:15px;color:#4e5b6d} @media(max-width:600px) and (orientation:portrait){#rotate{display:flex!important}}#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:32px;font-size:22px;line-height:1.45;color:#1e2343;background:#fff9e9;z-index:8}#rotate strong{font-size:32px}</style></head><body><div id="loading"><h1>Угадай слово</h1><p id="progress">Загружаем игру и английские слова…</p><p class="note">12 тем · 360 слов · озвучивание без интернета после загрузки</p><button id="launch" hidden>Играть!</button><p id="error" role="alert"></p></div><div id="rotate"><strong>Поверни экран</strong><span>Лисёнку нужен широкий экран!</span><span class="note">Эта версия удобнее на компьютере или планшете.</span></div><script src="wasm_exec.js"></script><script>
(async()=>{try{const go=new Go();const response=await fetch('game.wasm');if(!response.ok)throw new Error('HTTP '+response.status);const result=await WebAssembly.instantiate(await response.arrayBuffer(),go.importObject);document.getElementById('progress').textContent='Всё готово — начинаем?';const launch=document.getElementById('launch');launch.hidden=false;launch.onclick=()=>{document.getElementById('loading').style.display='none';go.run(result.instance).catch(showError)};}catch(e){showError(e)}})();function showError(e){document.getElementById('loading').style.display='grid';document.getElementById('error').textContent='Не удалось запустить игру: '+e.message+'. Запустите START_SERVER.py и откройте http://localhost:8080';console.error(e)}
</script></body></html>
